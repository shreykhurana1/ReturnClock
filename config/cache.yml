default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # No separate database: use ActiveRecord::Base's connection pool.
  <<: *default
  store_options:
    max_size: <%= 32.megabytes %>
    namespace: <%= Rails.env %>
